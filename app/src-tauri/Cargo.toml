[package]
name = "vibevoice"
version = "0.2.8"
description = "Local-first desktop voice input for developers"
authors = ["VibeVoice"]
edition = "2021"

[lib]
name = "vibevoice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
atomicwrites = "0.4.4"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
hound = "3"
libc = "0.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10.9"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tauri-plugin-updater = "^2"
tauri-plugin-process = "^2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-dialog = "=2.4.0"
# Keep the dialog dependency compatible with the qualified Tauri 2.11 runtime.
tauri-plugin-fs = "=2.4.2"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
cpal = "0.15"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "=0.13.2"
wl-clipboard-rs = "=0.9.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
