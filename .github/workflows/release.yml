name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-tauri:
    name: Build ${{ matrix.name }}
    # Fail closed: publishing is tag-driven only. The tag must be protected,
    # SemVer-shaped, and point at a commit already contained in master.
    if: >-
      github.ref_protected == true &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    environment: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-x86_64
            os: windows-latest
            args: ""
          - name: Linux
            platform: linux-x86_64
            os: ubuntu-22.04
            args: ""
          - name: macOS Apple Silicon
            platform: darwin-aarch64
            os: macos-14
            args: --target aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Verify tagged commit is already on master
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/master; then
            echo "Refusing to publish: $tag_commit is not contained in origin/master" >&2
            exit 1
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable

      - name: Install macOS target
        if: matrix.os == 'macos-14'
        run: rustup target add aarch64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: app/src-tauri

      - name: Install frontend dependencies
        run: npm ci
        working-directory: app

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high --ignore-scripts
        working-directory: app

      - name: Read and validate app version
        id: version
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid application version: '$version'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing VibeVoice v$version"

      - name: Verify release metadata consistency
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          expected_tag="v${version}"

          # Tag shape guard, evaluated inside the job: fail closed on
          # malformed release refs. A bare "v" tag (the 0.2.6 incident)
          # matches the push trigger but must never reach publishing.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Malformed release tag '$GITHUB_REF_NAME': expected a stable version after 'v'" >&2
              exit 1
            fi
          fi

          # Cross-check package.json, Cargo.toml, and tauri.conf.json versions.
          cargo_version="$(grep -m1 '^version' src-tauri/Cargo.toml 2>/dev/null | sed 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/' || true)"
          if [ -z "$cargo_version" ]; then
            echo "Unable to read version from src-tauri/Cargo.toml" >&2
            exit 1
          fi
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [[ "$cargo_version" != "$version" || "$tauri_version" != "$version" ]]; then
            echo "Version mismatch: package.json=$version Cargo.toml=$cargo_version tauri.conf.json=$tauri_version" >&2
            exit 1
          fi

          # Cargo.lock must pin the vibevoice package to the same version.
          lock_version="$(grep -A1 '^name = "vibevoice"' src-tauri/Cargo.lock 2>/dev/null | grep '^version' | sed 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/' || true)"
          if [ -z "$lock_version" ]; then
            echo "Unable to find vibevoice entry in src-tauri/Cargo.lock" >&2
            exit 1
          fi
          if [[ "$lock_version" != "$version" ]]; then
            echo "Cargo.lock vibevoice version $lock_version does not match app version $version" >&2
            exit 1
          fi

          # Tag/package consistency: a release tag must equal the app
          # version tag exactly.
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag '$GITHUB_REF_NAME' does not match app version tag '$expected_tag'" >&2
            exit 1
          fi
          echo "Release metadata consistent at version $version"

      - name: Finalize Linux AppStream release date and stability
        if: matrix.name == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/finalize-appstream-release.test.mjs
          node scripts/finalize-appstream-release.mjs "$GITHUB_REF_NAME" "$(date -u +%F)"

      - name: Load reviewed release notes and verify all version declarations
        id: release-notes
        shell: bash
        run: node scripts/prepare-release-notes.mjs "$GITHUB_REF_NAME"

      - name: Build signed release assets without publishing
        id: build
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          args: ${{ matrix.args }}
          includeRelease: true
          includeUpdaterJson: false

      - name: Stage signed platform artifacts
        env:
          ARTIFACT_PATHS: ${{ steps.build.outputs.artifactPaths }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: node scripts/release-artifacts.mjs stage release-staging

      - name: Retain platform artifacts for the single publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}
          path: release-staging/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish complete reviewed release
    needs: build-tauri
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Verify protected tag still belongs to master
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_PROTECTED" = true
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Download all successful platform builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-input
      - name: Assemble one updater manifest and validate all assets
        run: node scripts/release-artifacts.mjs assemble release-input release-output/assets
      - name: Upload to draft, verify every asset, then publish once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-artifacts.mjs publish release-output/assets
