name: CI

on:
  pull_request:
    branches:
      - master
      - codex/v0.2.8
  push:
    branches:
      - master
      - codex/v0.2.8

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-advisories:
    name: Rust dependency advisories
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - name: Install pinned Cargo audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Reject Rust dependency vulnerabilities
        run: cargo audit --file app/src-tauri/Cargo.lock

  rust:
    name: Rust checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          components: rustfmt,clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install disposable X11 clipboard test display
        run: sudo apt-get install -y --no-install-recommends xvfb xauth

      - name: Cache Rust
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: app/src-tauri

      - name: Check formatting
        run: cargo fmt --manifest-path app/src-tauri/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path app/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked --manifest-path app/src-tauri/Cargo.toml --no-default-features

      - name: Verify native empty Linux clipboard and inaccessible display
        run: xvfb-run -a cargo test --locked --manifest-path app/src-tauri/Cargo.toml linux_empty_clipboard_native_probe -- --ignored --test-threads=1

  frontend:
    name: Frontend checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: app

      - name: Check version consistency
        run: node scripts/prepare-release-notes.mjs --check

      - name: Run frontend tests
        run: npm test
        working-directory: app

      - name: Build frontend
        run: npm run build
        working-directory: app

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high --ignore-scripts
        working-directory: app

  native:
    name: Native checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          components: clippy
      - name: Cache Rust
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: app/src-tauri
      - name: Install frontend dependencies
        run: npm ci
        working-directory: app
      - name: Run native Rust tests
        run: cargo test --locked --manifest-path app/src-tauri/Cargo.toml
      - name: Verify native mixed Windows clipboard stays untouched
        if: runner.os == 'Windows'
        run: cargo test --locked --manifest-path app/src-tauri/Cargo.toml windows_mixed_clipboard_native_probe -- --ignored --test-threads=1
      - name: Run native Clippy
        run: cargo clippy --locked --manifest-path app/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build native release executable without publishing
        run: npm run tauri -- build --no-bundle -- --locked
        working-directory: app

  workflow-and-scripts:
    name: Workflow and script checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Parse and lint Bash scripts
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck
          for script in scripts/*.sh vp; do bash -n "$script"; done
          shellcheck scripts/*.sh vp
          bash scripts/test-vp.sh
          node --test scripts/*.test.mjs

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Path scripts -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { $errors += "{0}: {1}" -f $_.Name, ($parseErrors -join '; ') }
          }
          if ($errors.Count -gt 0) { $errors | Write-Error; exit 1 }

      - name: Test Windows source installer failure handling
        shell: pwsh
        run: ./scripts/test-install-app.ps1
