name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          components: rustfmt,clippy

      - name: Cache Rust
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: app/src-tauri

      - name: Check formatting
        run: cargo fmt --manifest-path app/src-tauri/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path app/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked --manifest-path app/src-tauri/Cargo.toml --no-default-features

  frontend:
    name: Frontend checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: app

      - name: Check version consistency
        working-directory: app
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8').match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          const lock = fs.readFileSync('src-tauri/Cargo.lock', 'utf8').match(/name = "vibevoice"\s+version = "([^"]+)"/s)?.[1];
          const values = { package: pkg.version, cargo, tauri: tauri.version, lock };
          if (new Set(Object.values(values)).size !== 1 || !/^\d+\.\d+\.\d+(?:[-.][0-9A-Za-z.-]+)?$/.test(pkg.version)) {
            console.error(values);
            process.exit(1);
          }
          console.log(`Version consistency: ${pkg.version}`);
          NODE

      - name: Run frontend tests
        run: npm test
        working-directory: app

      - name: Build frontend
        run: npm run build
        working-directory: app

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high --ignore-scripts
        working-directory: app

  workflow-and-scripts:
    name: Workflow and script checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Parse and lint Bash scripts
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck
          bash -n scripts/*.sh
          shellcheck scripts/*.sh

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Path scripts -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { $errors += "{0}: {1}" -f $_.Name, ($parseErrors -join '; ') }
          }
          if ($errors.Count -gt 0) { $errors | Write-Error; exit 1 }
